name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm ci --prefix integrations/antigravity
      - run: npm test --prefix integrations/antigravity
      - run: node --test integrations/browser-relay/tests/*.test.mjs
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - run: npm run check:vercel
